baseURL: "https://avisheksaha.com/"
title: "Avishek Saha"
pagination:
  pagerSize: 10
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
enableGitInfo: true

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      keepQuotes: true

params:
  env: production
  title: "Avishek Saha"
  description: "Applied AI Engineer building AI automation, RAG systems, multimodal agents, and Python/FastAPI data workflows with Azure OpenAI, Vertex AI, and SQL."
  keywords: ["Applied AI Engineer", "AI Automation", "AI Agents", "RAG", "Source Grounding", "FastAPI", "Python", "SQL", "Azure OpenAI", "Azure AI Foundry", "Copilot Studio", "Power Platform", "Vertex AI", "Gemini API", "Google ADK", "Data Science", "MCP", "Microsoft Fabric", "RAGAS", "LangChain", "LangGraph", "LlamaIndex", "Anthropic API"]
  author: "Avishek Saha"
  images: ["/images/og-image.png"]
  social:
    twitter: "avisheksaha_"
  DateFormat: "Jan 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  profileMode:
    enabled: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/sahaavi/sahaavi.github.io/tree/master/content"
    Text: "Suggest Changes"
    appendFilePath: true

menu:
  main:
    - identifier: experience
      name: Experience
      url: /experience/
      weight: 10
    - identifier: expertise
      name: Expertise
      url: /#expertise
      weight: 20
    - identifier: work
      name: Selected Work
      url: /#work
      weight: 30
    - identifier: writing
      name: Writing
      url: /posts/
      weight: 40
    - identifier: contact
      name: Contact
      url: /#contact
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
    style: monokai

permalinks:
  posts: /posts/:slug/
  projects: /projects/:slug/

taxonomies:
  tag: tags
  category: categories
  series: series
