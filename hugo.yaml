baseURL: "https://avisheksaha.com/"
title: "Avishek Saha | Applied AI & ML Engineer"
pagination:
  pagerSize: 10
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
enableGitInfo: true

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      keepQuotes: true

params:
  env: production
  title: "Avishek Saha | Applied AI & ML Engineer"
  description: "Applied AI and machine learning engineer with experience across LLM applications, RAG and evaluation, predictive ML, APIs, data systems, and cloud delivery."
  keywords: ["Applied AI Engineer", "Machine Learning Engineer", "LLM Evaluation", "RAG", "Predictive Machine Learning", "FastAPI", "Python", "MLOps"]
  author: "Avishek Saha"
  images: ["/images/og-image.png"]
  schema:
    publisherType: "Person"
    sameAs:
      - "https://github.com/sahaavi"
      - "https://linkedin.com/in/sahaavi"
  social:
    twitter: "avisheksaha_"
  DateFormat: "Jan 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  profileMode:
    enabled: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/sahaavi/sahaavi.github.io/tree/master/content"
    Text: "Suggest Changes"
    appendFilePath: true

menu:
  main:
    - identifier: experience
      name: Experience
      url: /experience/
      weight: 10
    - identifier: expertise
      name: Expertise
      url: /#expertise
      weight: 20
    - identifier: work
      name: Selected Work
      url: /#work
      weight: 30
    - identifier: writing
      name: Writing
      url: /posts/
      weight: 40
    - identifier: contact
      name: Contact
      url: /#contact
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
    style: monokai

permalinks:
  posts: /posts/:slug/
  projects: /projects/:slug/

taxonomies:
  tag: tags
  category: categories
  series: series
