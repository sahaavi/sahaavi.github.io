baseURL: "https://sahaavi.github.io/"
title: "Avishek Saha"
pagination:
  pagerSize: 10
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
enableGitInfo: true

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Avishek Saha"
  description: "Applied AI Engineer building multimodal agents and LLM systems for operational workflows"
  keywords: ["Applied AI Engineer", "Multimodal Agents", "LLM Systems", "Operational Workflows", "FastAPI", "RAG"]
  author: "Avishek Saha"
  images: ["/images/og-image.png"]
  DateFormat: "Jan 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  profileMode:
    enabled: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/sahaavi/sahaavi.github.io/tree/master/content"
    Text: "Suggest Changes"
    appendFilePath: true

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: books
      name: Books
      url: /books/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
    style: monokai

permalinks:
  posts: /posts/:slug/
  projects: /projects/:slug/

taxonomies:
  tag: tags
  category: categories
