# Site settings
title: Your Name - ML Engineer
email: your-email@example.com
description: >-
  Machine Learning Engineer portfolio, blog, and book publishing platform.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://username.github.io" # replace with your GitHub username
github_username: username
linkedin_username: username
permalink: /blog/:title/

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  books:
    output: true
    permalink: /books/:path/
  projects:
    output: true
    permalink: /projects/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Your Name"
  - scope:
      path: ""
      type: "books"
    values:
      layout: "book"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"