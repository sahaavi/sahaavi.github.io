{% extends "base.html" %}

{% block title %}{{ SITENAME }} - {{ page.title|striptags }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <article class="bg-white rounded-lg shadow-lg border border-gray-200 overflow-hidden">
        <header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-8">
            <h1 class="text-4xl font-bold">{{ page.title }}</h1>
            {% if page.summary %}
            <p class="text-blue-100 mt-4 text-lg">{{ page.summary }}</p>
            {% endif %}
        </header>
        
        <div class="p-8 prose prose-lg max-w-none">
            {{ page.content }}
        </div>
    </article>
</div>
{% endblock %}
