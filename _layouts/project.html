---
layout: default
---
<article class="project">
  <header class="project-header">
    <h1>{{ page.title }}</h1>
    {% if page.github_repo %}
    <a href="https://github.com/{{ page.github_repo }}" class="github-btn">View on GitHub</a>
    {% endif %}
  </header>

  <div class="project-content">
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
  <div class="project-tags">
    Technologies: 
    {% for tag in page.tags %}
    <span class="tag">{{ tag }}</span>
    {% endfor %}
  </div>
  {% endif %}
  
  {% if page.github_repo %}
  <div class="github-embed">
    <h2>Featured Code</h2>
    <div id="github-code"></div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        fetchGithubCode('{{ page.github_repo }}', '{{ page.featured_file | default: "README.md" }}', 'github-code');
      });
    </script>
  </div>
  {% endif %}
</article>
